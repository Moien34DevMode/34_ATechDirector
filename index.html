<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0a0a0a" />
        <meta
            name="description"
            content="Game Director Portfolio — interactive portfolio showcasing game direction, design, and philosophy."
        />

        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <!--
          GitHub Pages SPA redirect handler.

          When 404.html catches a deep-link reload it redirects here with the
          route encoded as ?p=/route-path.  This script restores the full URL
          (base pathname + route) before React Router mounts, so the router
          sees the correct path and renders the right scene.

          Example round-trip:
            User reloads: https://user.github.io/34_AGameDirector/abilities
            404.html redirects to:
              https://user.github.io/34_AGameDirector/?p=/abilities
            This script calls:
              replaceState(null, null, '/34_AGameDirector/abilities')
            React Router (basename='/34_AGameDirector/') sees '/abilities' ✓
        -->
        <script>
            (function (l) {
                var params = new URLSearchParams(l.search);
                var routePath = params.get('p');
                if (routePath) {
                    // l.pathname is the base, e.g. '/34_AGameDirector/'
                    // routePath is e.g. '/abilities'
                    // Strip trailing slash from base, add routePath
                    var base = l.pathname.replace(/\/$/, '');
                    var restored = base + routePath.replace(/~and~/g, '&');
                    window.history.replaceState(null, null, restored);
                }
            })(window.location);
        </script>

        <title>Game Director — Portfolio</title>
    </head>
    <body>
        <noscript>
            <p
                style="
                    font-family: sans-serif;
                    padding: 2rem;
                    text-align: center;
                "
            >
                This portfolio requires JavaScript. Please enable it in your
                browser settings.
            </p>
        </noscript>

        <div id="root"></div>

        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
