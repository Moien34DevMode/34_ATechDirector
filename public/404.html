<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Technical Director — Portfolio</title>

    <!--
      GitHub Pages SPA redirect script.

      When GitHub Pages 404s on a deep-link (e.g. /34_ATechDirector/abilities),
      this script re-encodes the FULL pathname as a query string on the repo
      root, then redirects to index.html which restores it before React mounts.

      We encode the entire pathname (minus the leading slash) so that
      index.html can do a simple replaceState with the full original path —
      no string manipulation needed there.

      segmentCount = 1  →  sub-path deploy (username.github.io/repo-name/)
      segmentCount = 0  →  root domain (username.github.io or custom domain)

      Source: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var segmentCount = 1;
      var l = window.location;

      // The base is everything up to and including the repo segment
      // e.g. https://moien34devmode.github.io/34_ATechDirector
      var base = l.protocol +
        '//' +
        l.hostname +
        (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/');

      // The path after the repo segment that React Router cares about
      // e.g. for /34_ATechDirector/abilities  →  /abilities
      var routePath = '/' + l.pathname
        .split('/')
        .slice(1 + segmentCount)
        .join('/');

      // Encode as query string: base/?/routePath
      // We keep the full routePath (with leading slash) so index.html can
      // simply prepend the base pathname and call replaceState.
      l.replace(
        base +
        '/?p=' +
        routePath.replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
